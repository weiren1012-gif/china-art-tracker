<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国文物拍卖追踪</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<header>
  <div class="header-left">
    <h1>🏛 中国文物拍卖追踪</h1>
    <span class="subtitle">全球主要拍卖行中国文物 · 流失海外石窟寺文物监测</span>
  </div>
  <div class="header-right">
    <span id="last-update" class="last-update"></span>
  </div>
</header>

<section class="tabs">
  <button class="tab active" data-tab="all">全部拍品</button>
  <button class="tab grotto-tab" data-tab="grotto">🛕 流失海外石窟寺文物(拍卖)</button>
  <button class="tab cave-tab" data-tab="cave">🗿 石窟造像(流失馆藏)</button>
  <button class="tab lost-tab" data-tab="lost">📋 被盗(丢失)文物</button>
  <button class="tab matched-tab" data-tab="matched">⚠️ 疑似重合</button>
  <button class="tab watch-tab" data-tab="watch">🚨 重点预警</button>
  <button class="tab" data-tab="new">🆕 新增记录</button>
</section>

<section id="stats" class="stats"></section>

<section class="toolbar">
  <input id="search-input" type="text" placeholder="搜索拍品名称 / 描述 / 拍卖会…">
  <select id="source-select">
    <option value="">全部拍卖行</option>
  </select>
  <select id="status-select">
    <option value="">全部状态</option>
    <option value="upcoming">即将拍卖</option>
    <option value="sold">已成交</option>
    <option value="unsold">未成交</option>
    <option value="withdrawn">已撤回</option>
  </select>
  <select id="sort-select">
    <option value="recent">最近更新</option>
    <option value="price_high">价格从高到低</option>
    <option value="price_low">价格从低到高</option>
  </select>
</section>

<section id="results-info" class="results-info"></section>
<section id="lots" class="lots"></section>
<div id="pagination" class="pagination"></div>
<footer class="footer">数据每日自动更新 · 数据来源:全球 11 家拍卖行官网公开信息</footer>

<div id="modal" class="modal hidden">
  <div class="modal-content">
    <button id="modal-close" class="modal-close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="app.js?v=6"></script>
</body>
</html>
